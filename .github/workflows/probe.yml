name: State map shots
on:
  push:
    branches: [acis-probe]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - run: node probe/shots.mjs
      - run: |
          git config user.name bot; git config user.email bot@example.com
          git checkout -b probe-out; git add -f shots; git commit -qm shots; git push -f origin probe-out:acis-probe-out
